<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的个人业务主页</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 20px; line-height: 1.7; color: #0f172a; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-top: 16px; }
    a.btn { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>你好，我是个人技能服务者 / 创作者</h1>
  <p>这里填写你的一句话定位：例如提供 PPT 美化、短视频剪辑、网站搭建或行业咨询。</p>
  <div class="card">
    <h2>可提供的服务与联系方式</h2>
    <ul>
      <li>标准服务 A：说明交付内容与周期</li>
      <li>定制服务 B：说明适用对象与报价区间</li>
    </ul>
    <a class="btn" href="https://wj.qq.com" target="_blank">点击填写需求预约单</a>
  </div>
</body>
</html>
